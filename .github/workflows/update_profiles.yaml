name: Update Slicer Profiles

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Open Filament Database
        uses: actions/checkout@v4
        with:
          repository: OpenFilamentCollective/open-filament-database
          path: open-filament-database
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - name: Ingest profiles
        run: |
          uv run slicer-profiles-db ingest-all --version latest --overlay overlay --skip prusaslicer
          uv run slicer-profiles-db ingest prusaslicer --version latest --legacy-source --force --overlay overlay
          prusa_lane_version=$(jq -r '.engines.prusaslicer.lanes["prusaslicer-3"].version' engines.lock.json)
          uv run slicer-profiles-db ingest prusaslicer --version "$prusa_lane_version" --force --overlay overlay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Map profiles
        run: uv run slicer-profiles-db map --ofd-path open-filament-database/data
        env:
          SP_API_URL: ${{ secrets.SP_PRINTER_DB_MODELS_URL }}

      - name: Publish content-addressed bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(sha256sum dist/profiles.spdb | cut -d' ' -f1)
          asset="dist/profiles-${hash}.spdb"
          cp dist/profiles.spdb "$asset"
          gh release view profile-catalogues >/dev/null 2>&1 || \
            gh release create profile-catalogues --title "Profile catalogues" --notes "Content-addressed import bundles."
          gh release upload profile-catalogues dist/profiles.spdb "$asset" --clobber

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profiles
          git diff --cached --quiet && exit 0
          git commit -m "chore(profiles): update generated profiles"
          git push
